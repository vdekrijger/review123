# Publishes the single-file local bridge (`bridge.mjs`) to GitHub Releases.
#
# TRIGGER: pushing a `bridge-v*` tag, and NOTHING else. No push-to-main, no
# pull_request, no schedule — this repo's Actions budget is not spent on
# anything that runs per commit.
#
# It needs no `pnpm install`: the bridge is a zero-dependency package and
# bridge/scripts/bundle.mjs pulls esbuild through `pnpm dlx` at a pinned
# version. Checkout + setup-node + bundle + upload runs in well under a
# minute (the bridge-v0.1.0 run took 23s, and that one still paid for an
# install this workflow no longer does).
#
# The FIRST release (bridge-v0.1.0) was cut locally, for the same budget
# reason, and cutting one by hand stays fully supported:
#
#   pnpm bridge:bundle
#   gh release create bridge-v0.1.1 bridge/dist/bundle/bridge.mjs --title … --notes …

name: Bridge release

on:
  push:
    tags:
      - 'bridge-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # `node …/bundle.mjs`, NOT `pnpm bridge:bundle`: pnpm's script runner
      # installs the workspace first, which on a fresh runner means the SPA's
      # whole dev tree (282 packages) for a bundle that needs none of it.
      # Invoked directly the script needs no node_modules at all — esbuild
      # comes from `pnpm dlx` inside it. Same output either way.
      #
      # bundle.mjs itself refuses to build when bridge/package.json and the
      # BRIDGE_VERSION in src/cli.ts disagree.
      - name: Bundle bridge.mjs
        run: node bridge/scripts/bundle.mjs

      # A release titled 0.2.0 that ships a 0.1.0 binary is exactly the kind of
      # lie a download-and-run artifact must not tell.
      - name: Check the tag matches the bridge version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./bridge/package.json').version")
          if [ "${TAG#bridge-v}" != "$version" ]; then
            echo "::error::tag $TAG does not match bridge version $version"
            exit 1
          fi

      - name: Publish the artifact to the tag's release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" bridge/dist/bundle/bridge.mjs --clobber
            exit 0
          fi
          # Quoted heredoc: no shell expansion, so backticks stay literal.
          cat > /tmp/bridge-notes.md <<'NOTES'
          The optional [local bridge](https://github.com/REPO_SLUG/blob/main/bridge/README.md) as a single self-contained file. Node 22+; no other dependencies.

          ```sh
          curl -fsSL https://github.com/REPO_SLUG/releases/latest/download/bridge.mjs -o ~/review123-bridge.mjs
          node ~/review123-bridge.mjs --root . --allow-write --allow-checkout
          ```

          Run it inside the repo you want to serve. It binds `127.0.0.1` only and requires the pairing token it prints on every request.

          Every capability flag is **off** in the code and must be typed to take effect. They are independent — none implies another — and they live on the command line so the grant still holds if review123.dev is ever compromised: nothing the site sends can switch one on. Drop them all for a strictly read-only bridge.

          - `--allow-write` — the fix loop, in a scratch git worktree, never your checkout.
          - `--allow-checkout` — lets review123 check a PR out in your working tree.
          - `--allow-push` — **the only flag that lets anything leave your machine, and a push cannot be undone.** It is NOT in the line above; add it deliberately or not at all. It permits exactly one thing: moving an **existing** remote branch **forward** to one commit, after you confirm the exact move. Fast-forward only — a push that would make any commit unreachable is refused, and there is no force anywhere in the protocol. Never the remote's default branch, and it never creates a branch. It cannot check who authored a pull request (the bridge has no GitHub account) and does not claim to.

          **While it runs it grants https://review123.dev read access to that repo**, to anyone holding that token. Without `--allow-push` nothing it does ever reaches a remote; the token dies with the process. The full security model is in [bridge/README.md](https://github.com/REPO_SLUG/blob/main/bridge/README.md).
          NOTES
          sed -i "s|REPO_SLUG|$REPO|g" /tmp/bridge-notes.md
          gh release create "$TAG" bridge/dist/bundle/bridge.mjs \
            --title "review123 local bridge ${TAG#bridge-v}" \
            --notes-file /tmp/bridge-notes.md
