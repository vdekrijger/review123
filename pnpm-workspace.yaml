packages:
  - '.'
allowBuilds:
  core-js: false
  # tree-sitter grammar packages: their install scripts only compile native
  # Node bindings we never import — the symbol click-through backend
  # (src/lib/symbols/treeSitter.ts) loads the prebuilt .wasm they ship.
  # Declaring false keeps CI's frozen install from ERR_PNPM_IGNORED_BUILDS.
  tree-sitter-go: false
  tree-sitter-javascript: false
  tree-sitter-python: false
  tree-sitter-ruby: false
  tree-sitter-typescript: false
# supply-chain gate: refuse package versions younger than 7 days
minimumReleaseAge: 10080
patchedDependencies:
  '@git-diff-view/svelte': patches/@git-diff-view__svelte.patch
